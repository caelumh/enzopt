<text x="631.5" y="252.7" font-size="11" fill="#777" text-anchor="middle">k₋₁</text>
<path d="M683.0,290.5 L666.2,342.0" stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M658.6,339.5 L675.3,288.0" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
