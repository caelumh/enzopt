<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 650" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="PINN 한 번의 계산: 신경망 곡선, 화학량, 효소 고리, 손실, 경사">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<rect width="1290" height="650" fill="#ffffff"/>
<rect x="30" y="150" width="180" height="70" rx="8" fill="#e8f1f9" stroke="#0072B2" stroke-width="1.5"/>
<text x="120.0" y="172.0" font-size="13.5" fill="#222" font-weight="700" text-anchor="middle">신경망</text>
<text x="120.0" y="190.0" font-size="12" fill="#222" text-anchor="middle">시드 × 웰마다 하나</text>
<text x="120.0" y="208.0" font-size="12" fill="#222" text-anchor="middle">폭 32, 깊이 3</text>
<path d="M180,104 V148" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="188" y="128" font-size="12" fill="#222" font-family="Consolas, 'D2Coding', monospace">τ = t / T</text>
<path d="M120,220 V238 H72 V258" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M120,238 H167 V258" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="260" width="85" height="46" rx="8" fill="#e8f1f9" stroke="#0072B2" stroke-width="1.5"/>
<text x="72.5" y="279.0" font-size="12" fill="#222" font-weight="700" text-anchor="middle">기울기</text>
<text x="72.5" y="297.0" font-size="11.5" fill="#222" text-anchor="middle">dNADH/dt</text>
<rect x="125" y="260" width="85" height="46" rx="8" fill="#e8f1f9" stroke="#0072B2" stroke-width="1.5"/>
<text x="167.5" y="279.0" font-size="12" fill="#222" font-weight="700" text-anchor="middle">곡선</text>
<text x="167.5" y="297.0" font-size="11.5" fill="#222" text-anchor="middle">NADH(t)</text>
<text x="30" y="326" font-size="10.5" fill="#666">기울기는 신경망을 미분해 정확히</text>
<rect x="245" y="245" width="170" height="80" rx="8" fill="#f7f7f7" stroke="#999999" stroke-width="1.5"/>
<text x="330.0" y="272.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">나머지 농도</text>
<text x="330.0" y="290.0" font-size="11.5" fill="#222" text-anchor="middle">Pyr = Pyr₀ − 쓴 양</text>
<text x="330.0" y="308.0" font-size="11.5" fill="#222" text-anchor="middle">Lac = NAD = 쓴 양</text>
<path d="M210,283 H243" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M415,290 H438" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="440" y="30" width="320" height="62" rx="8" fill="#fbece3" stroke="#D55E00" stroke-width="1.5"/>
<text x="600.0" y="48.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">속도 상수 θ (학습하는 값)</text>
<text x="600.0" y="66.0" font-size="11.5" fill="#222" text-anchor="middle">log10 [k₊₁~k₊₅, k₋₁~k₋₄, K′]</text>
<text x="600.0" y="84.0" font-size="11.5" fill="#222" text-anchor="middle">k₋₅는 K′에서 (Haldane)</text>
<path d="M600,92 V110" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="440" y="112" width="320" height="330" rx="10" fill="#fafcff" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="600" y="136" font-size="13.5" fill="#222" font-weight="700" text-anchor="middle">효소 고리 (준정상)</text>
<text x="600" y="432" font-size="11" fill="#555" text-anchor="middle">화살표 속도 = 상수 × 그때 농도</text>
<path d="M624.2,212.6 L668.0,244.5" stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M663.3,250.9 L619.5,219.1" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
