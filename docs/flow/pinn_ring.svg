<text x="649.5" y="312.1" font-size="11" fill="#777" text-anchor="middle">k₋₂</text>
<path d="M627.1,370.4 L572.9,370.4" stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M572.9,362.4 L627.1,362.4" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<text x="600.0" y="388.4" font-size="11.5" fill="#222" text-anchor="middle">k₊₃</text>
<text x="600.0" y="354.4" font-size="11" fill="#777" text-anchor="middle">k₋₃</text>
<path d="M533.8,342.0 L517.0,290.5" stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M524.7,288.0 L541.4,339.5" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<text x="505.5" y="326.7" font-size="11.5" fill="#222" text-anchor="middle">k₊₄</text>
<text x="567.9" y="306.4" font-size="11" fill="#777" text-anchor="middle">k₋₄·[Lac]</text>
<path d="M532.0,244.5 L575.8,212.6" stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M580.5,219.1 L536.7,250.9" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<text x="542.6" y="217.0" font-size="11.5" fill="#222" text-anchor="middle">k₊₅</text>
<text x="575.2" y="261.8" font-size="11" fill="#777" text-anchor="middle">k₋₅·[NAD]</text>
<rect x="576.0" y="186.0" width="48" height="28" rx="12" fill="#ffffff" stroke="#0072B2" stroke-width="1.4"/>
<text x="600.0" y="205.0" font-size="12.5" fill="#222" font-weight="700" text-anchor="middle">E</text>
<rect x="663.5" y="249.6" width="48" height="28" rx="12" fill="#ffffff" stroke="#0072B2" stroke-width="1.4"/>
<text x="687.5" y="268.6" font-size="12.5" fill="#222" font-weight="700" text-anchor="middle">EN</text>
<rect x="630.1" y="352.4" width="48" height="28" rx="12" fill="#ffffff" stroke="#0072B2" stroke-width="1.4"/>
<text x="654.1" y="371.4" font-size="12.5" fill="#222" font-weight="700" text-anchor="middle">ENP</text>
<rect x="521.9" y="352.4" width="48" height="28" rx="12" fill="#ffffff" stroke="#0072B2" stroke-width="1.4"/>
<text x="545.9" y="371.4" font-size="12.5" fill="#222" font-weight="700" text-anchor="middle">EQL</text>
<rect x="488.5" y="249.6" width="48" height="28" rx="12" fill="#ffffff" stroke="#0072B2" stroke-width="1.4"/>
<text x="512.5" y="268.6" font-size="12.5" fill="#222" font-weight="700" text-anchor="middle">EQ</text>
<rect x="790" y="110" width="220" height="60" rx="8" fill="#e6f5ef" stroke="#009E73" stroke-width="1.5"/>
<text x="900.0" y="136.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">예측 관측값</text>
<text x="900.0" y="154.0" font-size="11.5" fill="#222" text-anchor="middle">NADH + Et·(φ_EN + φ_ENP)</text>
<rect x="790" y="255" width="220" height="70" rx="8" fill="#e6f5ef" stroke="#009E73" stroke-width="1.5"/>
<text x="900.0" y="277.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">효소 분포 φ</text>
<text x="900.0" y="295.0" font-size="11.5" fill="#222" text-anchor="middle">형태마다 들어옴 = 나감, 합 1</text>
<text x="900.0" y="313.0" font-size="11.5" fill="#222" text-anchor="middle">(미분 가능한 풀이)</text>
<rect x="790" y="395" width="220" height="66" rx="8" fill="#e6f5ef" stroke="#009E73" stroke-width="1.5"/>
<text x="900.0" y="415.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">반응 속도 v</text>
<text x="900.0" y="433.0" font-size="11" fill="#222" text-anchor="middle">Et·(k₊₁·φ_E·[NADH] − k₋₁·φ_EN)</text>
<text x="900.0" y="451.0" font-size="11" fill="#222" text-anchor="middle">= 고리를 도는 흐름</text>
<path d="M760,290 H788" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M900,255 V172" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M900,325 V393" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="1040" y="24" width="210" height="54" rx="8" fill="#f7f7f7" stroke="#999999" stroke-width="1.5"/>
<text x="1145.0" y="47.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">측정값 y</text>
<text x="1145.0" y="65.0" font-size="11.5" fill="#222" text-anchor="middle">학습 웰 108개 × 50점</text>
<rect x="1040" y="110" width="210" height="60" rx="8" fill="#fbece3" stroke="#D55E00" stroke-width="1.5"/>
<text x="1145.0" y="136.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">데이터 항</text>
<text x="1145.0" y="154.0" font-size="11.5" fill="#222" text-anchor="middle">((y − 예측) / σ)², σ = 9 µM</text>
<path d="M1010,140 H1038" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M1145,78 V108" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="1040" y="488" width="210" height="92" rx="8" fill="#fbece3" stroke="#D55E00" stroke-width="1.5"/>
<text x="1145.0" y="512.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">손실 (시드마다)</text>
<text x="1145.0" y="530.0" font-size="11.5" fill="#222" text-anchor="middle">데이터 + w·물리</text>
<text x="1145.0" y="548.0" font-size="11.5" fill="#222" text-anchor="middle">+ 처음 조건 + 0.01·사전분포</text>
<text x="1145.0" y="566.0" font-size="11.5" fill="#222" text-anchor="middle">w: 1 → 10⁴로 올림</text>
<path d="M1145,170 V486" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="250" y="500" width="350" height="60" rx="8" fill="#fbece3" stroke="#D55E00" stroke-width="1.5"/>
<text x="425.0" y="526.0" font-size="13" fill="#222" font-weight="700" text-anchor="middle">물리 항</text>
<text x="425.0" y="544.0" font-size="11.5" fill="#222" text-anchor="middle">(dNADH/dt + v)²: 곡선 기울기 = 고리 속도?</text>
<path d="M72,306 V530 H248" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M900,461 V478 H425 V498" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M600,530 H1038" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<path d="M1250,534 H1272 V12 H14 V185 H28" stroke="#C0392B" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<path d="M600,12 V28" stroke="#C0392B" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<text x="245" y="44" font-size="11.5" fill="#C0392B">경사 → 속도 상수</text>
<text x="245" y="61" font-size="11" fill="#C0392B">(주로 물리 항에서, 고리를 거꾸로)</text>
<text x="24" y="142" font-size="11.5" fill="#C0392B">경사 → 신경망 가중치</text>
<path d="M40,616 H80" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="88" y="620" font-size="11.5" fill="#333">계산(순전파): 시각마다 매번</text>
<path d="M320,616 H360" stroke="#C0392B" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<text x="368" y="620" font-size="11.5" fill="#333">경사(역전파): 손실이 줄어드는 쪽으로 신경망과 속도 상수를 함께 고침</text>
<text x="40" y="640" font-size="11" fill="#666">예: ldh_wang2025. 학습 웰 108개 × 시드 × 재시작마다 이 계산을 Adam 2000번 + L-BFGS 1000번 되풀이합니다.</text>
</svg>
