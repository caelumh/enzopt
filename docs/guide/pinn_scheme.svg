<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="PINN 식별의 구조">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="384" fill="#ffffff"/>

  <g font-size="13" fill="#222" text-anchor="middle">
    <!-- time and conditions -->
    <rect x="20" y="40" width="190" height="96" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.3"/>
    <text x="115" y="64" font-size="15" font-weight="700">시간과 조건</text>
    <text x="115" y="86">실험 e마다 τ = t / Tₑ</text>
    <text x="115" y="104" font-size="12" fill="#666">(Tₑ = 그 실험의 길이)</text>
    <text x="115" y="124">초기 농도 · 효소량</text>

    <!-- rate constants -->
    <rect x="20" y="200" width="190" height="110" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.3"/>
    <text x="115" y="224" font-size="15" font-weight="700">속도 상수 k</text>
    <text x="115" y="246">학습 변수 (log k)</text>
    <text x="115" y="266">사전분포: 문헌 자릿수</text>
    <text x="115" y="284">중심 ± 1.5자릿수</text>
    <text x="115" y="301" font-size="12" fill="#666">자유 9개 + K′</text>

    <!-- network -->
    <rect x="250" y="40" width="210" height="96" rx="8" fill="#fdf1dc" stroke="#E69F00" stroke-width="1.5"/>
    <text x="355" y="64" font-size="15" font-weight="700">신경망 (실험마다)</text>
    <text x="355" y="88">τ → NADHₑ(τ)</text>
    <text x="355" y="110" font-size="12" fill="#666">측정점 사이를 잇는</text>
    <text x="355" y="126" font-size="12" fill="#666">매끈한 곡선 하나</text>

    <!-- physics residual -->
    <rect x="250" y="170" width="210" height="170" rx="8" fill="#e3f4ee" stroke="#009E73" stroke-width="1.5"/>
    <text x="355" y="194" font-size="15" font-weight="700">물리 잔차</text>
    <text x="355" y="218">dNADH/dt = −r₁(k, …)</text>
    <text x="355" y="242">효소 형태: 준정상</text>
    <text x="355" y="259" font-size="12" fill="#666">(King–Altman 5고리)</text>
    <text x="355" y="283">보존 법칙 4개 고정</text>
    <text x="355" y="305">Haldane: k₋₅ ← K′</text>
    <text x="355" y="327" font-size="12" fill="#666">곡선의 기울기가 반응식과 같아야</text>

    <!-- data term -->
    <rect x="500" y="40" width="200" height="96" rx="8" fill="#e3eef8" stroke="#0072B2" stroke-width="1.5"/>
    <text x="600" y="64" font-size="15" font-weight="700">데이터 항</text>
    <text x="600" y="90">Σ (신경망 − 측정)² / σ²</text>
    <text x="600" y="114" font-size="12" fill="#666">곡선이 측정점을 지나야</text>

    <!-- loss -->
    <rect x="740" y="40" width="240" height="170" rx="8" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/>
    <text x="860" y="64" font-size="15" font-weight="700">손실 최소화</text>
    <text x="860" y="88">데이터 + w_phys · 물리</text>
    <text x="860" y="106">+ w_prior · 사전분포</text>
    <text x="860" y="132">w_phys: 1 → 10⁴ (점점 엄격히)</text>
    <text x="860" y="156">Adam 2000 → L-BFGS 300</text>
    <text x="860" y="178">시드마다 재시작 8번</text>
    <text x="860" y="198" font-size="12" fill="#666">GPU에서 한꺼번에</text>

    <!-- check -->
    <rect x="740" y="250" width="240" height="118" rx="8" fill="#fde9df" stroke="#D55E00" stroke-width="1.5"/>
    <text x="860" y="274" font-size="15" font-weight="700">검사 (학습이 끝나면)</text>
    <text x="860" y="298">학습된 k로 ODE 다시 풀기</text>
    <text x="860" y="316" font-size="12" fill="#666">(scipy, 신경망 없이)</text>
    <text x="860" y="340">재해석 RMSE ≤ 3σ → 표본</text>
    <text x="860" y="359" font-size="12" fill="#666">넘으면 제외 · 재시작 중 최선 선택</text>
  </g>

  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <path d="M211,88 H248"/>
    <path d="M461,88 H498"/>
    <path d="M355,137 V168"/>
    <path d="M211,255 H248"/>
    <path d="M701,88 H738"/>
    <path d="M461,240 H718 V182 H738"/>
    <path d="M860,211 V248"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="364" y="157">NADH, 기울기</text>
    <text x="229" y="248" text-anchor="middle">k</text>
    <text x="590" y="232" text-anchor="middle">물리 항</text>
  </g>
</svg>
