# 현실적 합성 데이터 설정 (명세 RK2, EVAL.md 부록 B)
# 마일스톤 0에서 한 번 만들고 고치지 않는다(EVAL.md "변경 금지"). 생성기: `uv run enzopt synth evals/synthetic.yaml <프로젝트 폴더>`
# 항목은 사용자가 승인했고 수치는 Claude가 정했다. 단위: mM, s.
version: 1
seed: 20261010            # 실험별 오차·잡음 난수의 시드(고정)

truth:                    # 정답 = CADKIMM analysis/pinn_full_mechanism.py 와 같음
  network: ldh_ordered_bibi
  species: [E, NADH, EN, Pyr, ENP, EQL, Lac, EQ, NAD]
  enzyme_species: [E, EN, ENP, EQL, EQ]
  steps:
    - E + NADH <=> EN
    - EN + Pyr <=> ENP
    - ENP <=> EQL
    - EQL <=> EQ + Lac
    - EQ <=> E + NAD
  kf: [1.0e+4, 5.0e+3, 300.0, 1000.0, 200.0]   # k+1, k+2 (1/mM/s), k+3, k+4, k+5 (1/s)
  kr: [50.0, 500.0, 1000.0, 200.0]             # k-1, k-2, k-3 (1/s), k-4 (1/mM/s). k-5 = Haldane
  Kp: 23.0                                     # pH 10, 25 °C
  haldane_step: 5
  enzyme:                                      # 명목 효소량 = 세트 A가 평형까지의 절반을 120 s에 가는 Et (CADKIMM choose_Et)
    rule: set_A_half_life
    half_life_s: 120.0

observation:
  A340_coefficients: {NADH: 6.22, EN: 6.22, ENP: 6.22}   # A340 = 6.22·(NADH + EN + ENP), 1 cm
  t_first_s: 5.0          # 첫 관측(혼합 사점)
  t_end_s: 900.0
  dt_s: 10.0

experiments:              # 학습 A·B, 홀드아웃 C·D' (CADKIMM SETS)
  A:  {NADH: 0.2, NAD: 0.0, Pyr: 0.2, Lac: 9.8, role: train}
  B:  {NADH: 0.0, NAD: 0.2, Pyr: 0.0, Lac: 10.0, role: train}
  C:  {NADH: 0.1, NAD: 0.1, Pyr: 0.1, Lac: 9.9, role: holdout}
  Dp: {NADH: 0.2, NAD: 0.0, Pyr: 0.5, Lac: 9.5, role: holdout}

design_check:             # 설계 확인 세트 예시(CADKIMM 합성 설계값: ρ* = 9, 강건 Et* 180.54 nM, 공칭 31.35 nM)
  t_end_s: 600.0
  sets:
    D1: {NADH: 0.1, NAD: 0.0, Pyr: 0.9, Lac: 0.0, Et_nM: 180.54, role: design-check}
    D0: {NADH: 0.1, NAD: 0.0, Pyr: 0.9, Lac: 0.0, Et_nM: 31.35, role: design-check}

effects:
  noise_sigma_A340: 0.003            # 가우스 잡음
  start_time_error_s: 1.0            # 실제 시작 시각 = 명목 ± U(-1, 1) s (실험별)
  baseline_drift_A340_per_900s: 0.002  # 선형 표류, 기울기 U(-0.002, +0.002) / 900 s (실험별)
  enzyme_error_frac: 0.10            # 실제 Et = 명목 × U(0.9, 1.1) (실험별). 식별 쪽은 명목만 안다
  temperature: {mean_C: 25.0, sd_C: 0.02, dt_s: 1.0}
  draw_order: [enzyme_factor, start_offset, drift_slope, noise, temperature]   # 실험마다 이 순서로 난수를 뽑는다

prior:                    # 사전분포 = 정답을 10의 거듭제곱으로 반올림(문헌 자릿수만 안다는 가정), 표준편차 1.5 자릿수
  rule: round_log10_truth
  sd_decades: 1.5
  kf_log10: [4, 4, 2, 3, 2]    # round(log10 [1e4, 5e3, 300, 1000, 200])
  kr_log10: [2, 3, 3, 2]       # round(log10 [50, 500, 1000, 200])
  Kp_log10: 1                  # round(log10 23)

holdout_criterion:        # AC-05: 홀드아웃 C·D' 외삽 RMSE ≤ max(2σ, 정답 모델 RMSE × 1.5) (세트마다 표본 평균과 최악, 관측 데이터 대비)
  rmse_max_A340: 0.006            # 2σ (절대 하한)
  oracle_factor: 1.5              # 정답 모델(정답 속도 상수 + 명목 효소량) RMSE의 배수 (보완 인터뷰 2026-10-09 Q1)
