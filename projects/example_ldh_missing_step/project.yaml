# 빠진 단계 예제 — 데이터를 만든 진짜 메커니즘에는 아래 다섯 단계 말고 한 단계(EN + Lac <=> ENL, Ki 5 mM)가 더 있다.
# `uv run enzopt suggest projects/example_ldh_missing_step`이 그 단계를 찾아내는지 보는 예제. 정답은 data/truth.json.
name: example_ldh_missing_step
description: 빠진 단계 예제 — LDH 다섯 단계 + 숨은 잘못 붙은 복합체 E·NADH·Lac, 젖산 0·10·30 mM

network:
  name: ldh_ordered_bibi
  species: [E, NADH, EN, Pyr, ENP, EQL, Lac, EQ, NAD]
  enzyme_species: [E, EN, ENP, EQL, EQ]
  steps:
    - E + NADH <=> EN
    - EN + Pyr <=> ENP
    - ENP <=> EQL
    - EQL <=> EQ + Lac
    - EQ <=> E + NAD
  observable:
    name: A340
    coefficients: {NADH: 6.22, EN: 6.22, ENP: 6.22}
  thermodynamics:
    overall: Pyr + NADH <=> Lac + NAD
    Kp: 23.0
    haldane_step: 5
  prior:
    kf_log10: [4, 4, 2, 3, 2]
    kr_log10: [2, 3, 3, 2]
    Kp_log10: 1
    sd_decades: 1.5

control:
  one_way_steps: [5]

# 젖산을 0·10·30 mM로 바꾼다: 젖산이 있어야만 생기는 복합체는 젖산이 일정하면 보이지 않는다
experiments:
  A0:  {file: data/setA0.csv,  NADH: 0.2, NAD: 0.0, Pyr: 0.2, Lac: 0.0,  Et_nM: 24.23, role: train}
  A10: {file: data/setA10.csv, NADH: 0.2, NAD: 0.0, Pyr: 0.2, Lac: 10.0, Et_nM: 24.23, role: train}
  A30: {file: data/setA30.csv, NADH: 0.2, NAD: 0.0, Pyr: 0.2, Lac: 30.0, Et_nM: 24.23, role: train}
  B10: {file: data/setB10.csv, NADH: 0.0, NAD: 0.2, Pyr: 0.0, Lac: 10.0, Et_nM: 24.23, role: train}
  B30: {file: data/setB30.csv, NADH: 0.0, NAD: 0.2, Pyr: 0.0, Lac: 30.0, Et_nM: 24.23, role: train}
  C20: {file: data/setC20.csv, NADH: 0.1, NAD: 0.1, Pyr: 0.1, Lac: 20.0, Et_nM: 24.23, role: holdout}

identification:
  method: pinn
  seeds: 4
  noise_sigma: 0.003
  pinn: {adam_iters: 2000, lbfgs_iters: 300, restarts: 8}
  baseline_fit: {starts: 4}
  control: {seeds: 2}

simulation:
  t_long_s: 3000
  same_class_runs: 12
  hopsan:
    enabled: true
    one_step_k1: auto
    representative_experiment: A10

design:
  target: assay
  analyte: NADH
  partner: Pyr
  free_enzyme: E
  analyte0_mM: 0.1
  conversion: 0.99
  time_s: 300
  Kp: 23.0
  dead_end:
    step: EQ + Pyr <=> EQP
    enzyme_species: [EQP]
    kf: 1000.0
    Ki_mM: 5.0
  rho_grid: auto
  pipette:
    volume_uL: 1000
    enzyme_uL: 10
    stocks_mM: {NADH: 2.0, Pyr: 10.0}
    limit_test_rhos: [1.5, 3.0]
    limit_test_enzyme_multiples: [[10, 20], [10]]
