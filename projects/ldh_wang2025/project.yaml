# 공개 문헌 데이터 프로젝트: Wang 외 (2025) 토끼 근육 LDH, 피루브산 + NADH, PBS, 23 ℃, 플레이트 리더 340 nm
# 데이터: figshare doi:10.6084/m9.figshare.26961733 (CC BY 4.0). make_data.py가 raw/Experimental_data.xlsx의 원 흡광을
# 저자 환산(ε 6.3 /(mM·cm), 광로 0.3118 cm)으로 NADH 농도로 바꿈. 처음 NADH = 웰의 첫 읽기, 피루브산 = 명목값
name: ldh_wang2025
description: 공개 문헌 데이터 — Wang 외(2025) 토끼 근육 LDH, 피루브산 0.023~2 mM × NADH 0.4~0.6 mM × 효소 3가지, 웰 179개, 490초

network:
  name: ldh_ordered_bibi
  species: [E, NADH, EN, Pyr, ENP, EQL, Lac, EQ, NAD]
  enzyme_species: [E, EN, ENP, EQL, EQ]
  steps:
    - E + NADH <=> EN
    - EN + Pyr <=> ENP
    - ENP <=> EQL
    - EQL <=> EQ + Lac
    - EQ <=> E + NAD
  observable:
    name: NADH_mM
    coefficients: {NADH: 1.0, EN: 1.0, ENP: 1.0}   # 효소에 붙은 NADH도 340 nm에서 보임
  thermodynamics:
    overall: Pyr + NADH <=> Lac + NAD
    Kp: 9.2e3                # PBS pH 7.4 가정: pH 7.0의 2.3×10⁴(ldh_holmes1988)에서 pH 1당 10배(H⁺ 하나 소비)
    haldane_step: 5
  prior:                     # ldh_holmes1988와 같은 문헌 자릿수, 표준편차 1.5 자릿수
    kf_log10: [4, 4, 2, 3, 2]
    kr_log10: [2, 3, 3, 2]
    Kp_log10: 4
    sd_decades: 1.5

identification:
  method: pinn
  seeds: 4
  noise_sigma: 0.009         # mM = 9 µM: 같은 조건 3반복 웰끼리 곡선 모양 차이 중앙값 8.8 µM(웰별 효소량·피펫 차이를
                             # 모델이 따로 갖지 않으므로 잡음으로 봄). 읽기 잡음만은 1.2 µM(첫 실행 σ 2 µM은 표본 0개, README)
  pinn: {restarts: 8, selection: criteria}   # 2026-10-15: 고정 출발점 32개(시드 4 × 재시작 8) 학습 → 동등 적합(우도비) 후보 전부를 표본으로
  baseline_fit: {starts: 4, max_nfev: 40}   # 학습 웰이 108개라 반복을 줄임

simulation:
  t_long_s: 43200            # 12시간: Hopsan 겉보기 1단계 배치(k₁ 8.7×10⁻⁴ /(mM·s))가 평형에 닿도록. 1시간이면 0/13 통과
                             # (|ln Q/K| 3.9~5, scipy와 같은 값이라 수치 오류가 아니라 시간 부족, pgm_eno_giess2026과 같음)

design:                      # 참고용: 피루브산 정량(NADH를 짝 기질로). 0.215 mM을 10분 안에 99 %
  target: assay
  analyte: Pyr
  partner: NADH
  free_enzyme: E
  analyte0_mM: 0.215          # 2026-10-16: 학습 웰 피루브산 범위(0.0231~2 mM)의 기하 평균 √(0.0231×2) = 0.2150(사용자 결정, 이전 0.1은 도구 기본값)
  conversion: 0.99
  time_s: 600
  Kp: 9.2e3
  rho_grid: auto
  rho_max: train              # 2026-10-15: ρ 상한 = 학습 웰의 최대 NADH(0.458 mM) ÷ 피루브산 0.215 mM = 2.13 — 학습 범위 밖으로 외삽하지 않음(사용자 결정)
  pipette:
    volume_uL: 200
    enzyme_uL: 10
    stocks_mM: {NADH: 5.0, Pyr: 10.0}
    limit_test_rhos: []
    limit_test_enzyme_multiples: []

# 실행 5번 × 피루브산 12농도(2 mM부터 1.5배씩 묽힘) × 3반복. 학습: 실행 2·3·4(효소 3.42 nM 활성 자리, NADH 0.5·0.4·0.6 mM),
# 홀드아웃: 실행 1·5(효소 2.73·4.27 nM, 학습에 없는 효소량)
