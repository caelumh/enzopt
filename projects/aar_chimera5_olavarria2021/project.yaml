# 공개 문헌 데이터 프로젝트: Olavarria (2021) 아세토아세틸-CoA 환원효소(AAR, PhaB 키메라 "Chimera 5")와 NADH, 30 ℃
# 데이터: Mendeley Data doi:10.17632/tspycdy2rm.1 (TU Delft, CC BY 4.0). make_data.py가 raw/의 작업 파일에서 웰마다
# 생성물(µM, 저자가 360 nm 흡광으로 계산)을 꺼내 mM로 바꿈. 반응: AcAcCoA + NADH → (R)-3-히드록시부티릴-CoA + NAD⁺
name: aar_chimera5_olavarria2021
description: 공개 문헌 데이터 — Olavarria 2021 AAR Chimera 5 + NADH, 360 nm 진행 곡선 36개(8 s × 1 h), 30 ℃

network:
  name: aar_ordered_dead_end
  # 저자 모델(simple_model_AARs: AcAcCoA가 먼저 붙고 NADH가 붙은 뒤 한 번에 생성물 둘을 냄, AcAcCoA의 기질 저해)을
  # 빠른 평형 대신 질량 작용으로. EA = E·AcAcCoA, EAN = E·AcAcCoA·NADH, EAAN = EAN에 AcAcCoA가 하나 더(막다른)
  species: [E, AcAc, EA, NADH, EAN, NAD, HB, EAAN]
  enzyme_species: [E, EA, EAN, EAAN]
  steps:
    - E + AcAc <=> EA               # 1 AcAcCoA 결합
    - EA + NADH <=> EAN             # 2 NADH 결합
    - EAN -> E + NAD + HB           # 3 환원과 생성물 방출(저자: 한 방향)
    - EAN + AcAc <=> EAAN           # 4 기질 저해(AcAcCoA가 하나 더 붙음)
  observable:
    name: P_mM                      # 생성물 = 쓰인 NADH(효소 1~4 nM이라 효소에 붙은 몫은 무시할 만함)
    coefficients: {NAD: 1}
  thermodynamics:
    reactions:                      # 저자 모델이 한 방향이라 K'를 쓰지 않음
      - {overall: AcAc + NADH <=> NAD + HB}
  prior:                            # 일반 자릿수(저자 값이 아님, README "사전분포"), 표준편차 1.5 자릿수
    kf_log10: [3, 3, 2, 3]          # 결합 1/(mM·s), 단계 3 1/s
    kr_log10: [2, 2, 2]             # 가역 단계 1, 2, 4의 해리 1/s(해리 상수 0.1 mM 근처)
    sd_decades: 1.5

identification:
  method: pinn
  seeds: 4
  noise_sigma: 0.0004               # mM = 0.4 µM. 2차 차분으로 잰 웰별 잡음(중앙값 NADH 묶음 0.17, AcAcCoA 묶음 0.43 µM)
  baseline_fit: {starts: 4, max_nfev: 200}

simulation:
  t_long_s: 3600

design:                             # 참고용: AcAcCoA 0.1 mM을 10분 안에 99 % 환원하는 최소 효소량과 NADH 비
  target: assay
  analyte: AcAc
  partner: NADH                     # ρ = NADH ÷ AcAcCoA
  free_enzyme: E
  analyte0_mM: 0.1
  conversion: 0.99
  time_s: 600
  rho_grid: [1.5, 2, 3, 5, 10]
  Et_bounds_mM: [1.0e-7, 1.0e-3]
  check_t_end_s: 1800
  pipette:
    volume_uL: 100
    enzyme_uL: 5
    stocks_mM: {AcAc: 2, NADH: 10}
    limit_test_rhos: []
    limit_test_enzyme_multiples: []

# 처음 농도 = 첫 측정 시점(t = 0)의 값: 생성물은 그때까지 이미 생긴 양, 바뀐 기질은 저자가 계산한 그 시점의 값,
# 고정한 기질은 명목값 − 이미 생긴 생성물. N_* = NADH를 바꾼 24개(AcAcCoA 1.6 mM), A_* = AcAcCoA를 바꾼 12개(NADH 약 1 mM).
# N_*: 학습·홀드아웃을 농도 순으로 번갈아, 가장 높은 N_B12(600 µM)는 홀드아웃(외삽). A_*: 웰마다 처음 속도가 거의 같은
# 농도에서도 2배까지 달라(효소 1 nM의 웰별 차이로 보임) 학습에 넣지 않고 예측만 비교(design-check, README)
