  S25_B: {file: data/S25_B.csv, ABTS: 0.020265, P: 0, Et_nM: 73.94, role: holdout}   # 25 µM nominal, 11 points
  S25_C: {file: data/S25_C.csv, ABTS: 0.020146, P: 0, Et_nM: 73.94, role: holdout}   # 25 µM nominal, 11 points
  S50_A: {file: data/S50_A.csv, ABTS: 0.042434, P: 0, Et_nM: 73.94, role: train}   # 50 µM nominal, 11 points
