# 효소 실활 예제 — 측정 중에 효소가 활성을 잃는 데이터에서 속도 상수와 활성 곡선 a(t)를 함께 식별한다.
# 데이터는 make_data.py가 만든 합성 데이터(정답은 data/truth.json). 실데이터에서는 identification.pinn.inactivation만 켜면 된다.
name: example_ldh_inactivation
description: 효소 실활 예제 — LDH 순차 bi-bi, 지연 후 급락하는 실활(a = 1/(1+(t/300 s)³)), 학습 A·B·C, 홀드아웃 D'

network:
  name: ldh_ordered_bibi
  species: [E, NADH, EN, Pyr, ENP, EQL, Lac, EQ, NAD]
  enzyme_species: [E, EN, ENP, EQL, EQ]
  steps:
    - E + NADH <=> EN
    - EN + Pyr <=> ENP
    - ENP <=> EQL
    - EQL <=> EQ + Lac
    - EQ <=> E + NAD
  observable:
    name: A340
    coefficients: {NADH: 6.22, EN: 6.22, ENP: 6.22}
  thermodynamics:
    overall: Pyr + NADH <=> Lac + NAD
    Kp: 23.0
    haldane_step: 5
  prior:
    kf_log10: [4, 4, 2, 3, 2]
    kr_log10: [2, 3, 3, 2]
    Kp_log10: 1
    sd_decades: 1.5

control:
  one_way_steps: [5]

experiments:
  A:  {file: data/setA.csv,  NADH: 0.2, NAD: 0.0, Pyr: 0.2, Lac: 9.8,  Et_nM: 24.23, role: train}
  B:  {file: data/setB.csv,  NADH: 0.0, NAD: 0.2, Pyr: 0.0, Lac: 10.0, Et_nM: 24.23, role: train}
  C:  {file: data/setC.csv,  NADH: 0.1, NAD: 0.1, Pyr: 0.1, Lac: 9.9,  Et_nM: 24.23, role: train}
  Dp: {file: data/setDp.csv, NADH: 0.2, NAD: 0.0, Pyr: 0.5, Lac: 9.5,  Et_nM: 24.23, role: holdout}

identification:
  method: pinn
  seeds: 8                  # a(t)까지 추정하면 불확실성이 커진다. 4개로는 강건 효소량이 실제 필요량보다 작았다(docs/inactivation)
  noise_sigma: 0.003
  pinn:
    adam_iters: 2000
    lbfgs_iters: 300
    restarts: 8
    inactivation: shared     # 모든 실험이 같은 효소 활성 a(t)를 공유(효소를 넣은 뒤 시간). 모양은 정하지 않는다
  baseline_fit: {starts: 4}  # 고전 피팅 기준선은 실활을 모델에 넣지 않는다(비교용)
  control: {seeds: 2}

simulation:
  t_long_s: 3000
  same_class_runs: 12
  hopsan:
    enabled: true
    one_step_k1: auto
    representative_experiment: A

design:
  target: assay
  analyte: NADH
  partner: Pyr
  free_enzyme: E
  analyte0_mM: 0.1
  conversion: 0.99
  time_s: 300
  Kp: 23.0
  dead_end:
    step: EQ + Pyr <=> EQP
    enzyme_species: [EQP]
    kf: 1000.0
    Ki_mM: 5.0
  rho_grid: auto
  pipette:
    volume_uL: 1000
    enzyme_uL: 10
    stocks_mM: {NADH: 2.0, Pyr: 10.0}
    limit_test_rhos: [1.5, 3.0]
    limit_test_enzyme_multiples: [[10, 20], [10]]
